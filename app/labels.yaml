  ten_nguoi_uy_thac_nhap_khau: {en: entrusted_importer_name, group: "Parties", default_op: contains}
  ma_nuoc: {en: {export: destination_country_code, import: shipped_from_country_code}, group: "Parties", essential: true}
  tri_gia_hoa_don: {en: invoice_value, group: "Value", essential: true}
  don_gia_hoa_don: {en: invoice_unit_price, group: "Value", essential: true}
