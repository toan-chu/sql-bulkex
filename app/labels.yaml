# BulkEx field names - Chairman's English names (2026-10-19).
# key: database column (same on every machine). en: English name; the page shows it in Title Case
# without underscores (hs -> HS). group: where it sits in the field lists. essential: in the default column set.
# A column whose meaning differs between Export and Import can take  en: {export: ..., import: ...}
# Edit freely; the runner re-reads this file on every run.
group_order: [Goods, Parties, Value, Duty & Tax, Logistics, Declaration]
acronyms: [hs]
fields:
  so_to_khai: {en: declaration_number, group: "Declaration"}
  ma_chi_cuc_hai_quan_tao_moi: {en: customs_sub_department_code, group: "Declaration"}
  ma_loai_hinh: {en: declaration_type_code, group: "Declaration"}
  phan_ghi_chu: {en: remarks, group: "Declaration", default_op: contains}
  ma_so_hang_hoa: {en: hs_code, group: "Goods", essential: true, default_op: starts_with}
  mo_ta_hang_hoa: {en: goods_description, group: "Goods", essential: true, default_op: contains}
  so_luong_1: {en: quantity_1, group: "Goods", essential: true}
  ma_don_vi_tinh_1: {en: unit_code_1, group: "Goods", essential: true}
  don_vi_cua_don_gia_va_so_luong: {en: unit_price_and_quantity_unit, group: "Goods"}
  ma_nuoc_xuat_xu: {en: country_of_origin_code, group: "Goods", essential: true}
