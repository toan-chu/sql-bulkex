  don_gia_tinh_thue: {en: taxable_unit_price, group: "Duty & Tax"}
  tong_gia_tri_tinh_thue: {en: total_taxable_value, group: "Duty & Tax"}
  tong_tri_gia_tinh_thue: {en: total_taxable_value, group: "Duty & Tax"}
  thue_suat_thue_xuat_khau: {en: export_duty_rate, group: "Duty & Tax"}
  thue_suat_thue_nhap_khau: {en: import_duty_rate, group: "Duty & Tax"}
  phan_loai_nhap_thue_suat_thue_xuat_khau: {en: export_duty_rate_input_type, group: "Duty & Tax"}
